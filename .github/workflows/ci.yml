name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.13.5'
          python-version: ${{ matrix.python }}
      - run: uv sync --locked
      - run: uv run pytest

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.13.5'
      - run: uv sync --locked
      - run: uv run ruff check
      - run: uv run ruff format --check
      - run: node --check action.js
      - run: uv run yamllint --strict .
      - run: uv run check-jsonschema --builtin-schema vendor.github-actions action.yml
      - run: uv run check-jsonschema --builtin-schema vendor.dependabot .github/dependabot.yml
      - run: >-
          docker run --rm --volume "$PWD:/repo" --workdir /repo
          rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
          -color

  # Run the pull request's version of the action against the pull request itself, report only.
  self-test:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: hygiene
        uses: ./
        with:
          rules: .github/pr-hygiene.yml
          dry-run: true
      - run: echo "worst=$WORST count=$COUNT"
        env:
          WORST: ${{ steps.hygiene.outputs.worst }}
          COUNT: ${{ steps.hygiene.outputs.count }}
