[project]
name = "pr-hygiene"
version = "0"
description = "GitHub Action that keeps files that do not belong out of pull requests"
requires-python = ">=3.12"
dependencies = [
  "pathspec==1.1.1",
  "pyyaml==6.0.3",
  "unidiff==1.0.1",
]

[dependency-groups]
dev = [
  "check-jsonschema==0.38.2",
  "pytest==9.2.0",
  "ruff==0.17.2",
  "yamllint==1.38.0",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100

[tool.ruff.lint]
extend-select = ["I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
